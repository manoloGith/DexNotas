name: Release

# Push a tag like v0.1.0, or run this workflow by hand (it then tags the commit it runs on with
# the version in gradle.properties), to build the release APK and publish it as a GitHub release.
# With the repository secrets DEXNOTAS_KEYSTORE_BASE64, DEXNOTAS_KEYSTORE_PASSWORD and
# DEXNOTAS_KEY_ALIAS (or DexPdfCraft's DEXPDFCRAFT_* ones, to share its key) the APK is signed
# with the release key; without them it is signed with a debug
# key and published as a pre-release. A tag with a suffix (v0.1.0-beta.1) is always a pre-release:
# the APK's version is the part before the suffix, and its notes are that version's. Run by hand,
# the `suffix` input gives the same.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      suffix:
        description: "Pre-release suffix (beta.1 publishes v<version>-beta.1 as a pre-release; empty: the version itself)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version (the tag's, or gradle.properties' when run by hand)
        id: version
        run: |
          listed="$(sed -n 's/^dexnotas.version=//p' apps/dexnotas/android/gradle.properties)"
          suffix="${{ github.event.inputs.suffix }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; elif [ -n "${suffix}" ]; then tag="v${listed}-${suffix}"; else tag="v${listed}"; fi
          version="${tag#v}"
          base="${version%%-*}"
          [ "${base}" = "${listed}" ] || { echo "gradle.properties' dexnotas.version is ${listed}, not ${base}"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "notes=docs/release-notes/v${base}.md" >> "$GITHUB_OUTPUT"
          if [ "${version}" != "${base}" ]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rust (rust-toolchain.toml) and cargo-ndk
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Release key
        id: key
        env:
          # DexNotas' own key, or the Dex family's (the same secrets as DexPdfCraft's, by name).
          KEYSTORE_BASE64: ${{ secrets.DEXNOTAS_KEYSTORE_BASE64 || secrets.DEXPDFCRAFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEXNOTAS_KEYSTORE_PASSWORD || secrets.DEXPDFCRAFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEXNOTAS_KEY_ALIAS || secrets.DEXPDFCRAFT_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Pasted secrets may carry spaces or line breaks: drop them.
            store="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$store"
            store_pass="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
            # A PKCS12 keystore (keytool's default) keys with the store's password.
            key_pass="$store_pass"
            alias="$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')"
            # An alias the keystore doesn't have: use its only key.
            if ! keytool -list -keystore "$store" -storepass "$store_pass" -alias "$alias" > /dev/null 2>&1; then
              found="$(keytool -list -v -keystore "$store" -storepass "$store_pass" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
              echo "The key alias secret doesn't name a key in the keystore; using its key '${found}'."
              alias="$found"
            fi
            echo "::add-mask::$store_pass"
            {
              echo "DEXNOTAS_KEYSTORE=$store"
              echo "DEXNOTAS_KEYSTORE_PASSWORD=$store_pass"
              echo "DEXNOTAS_KEY_ALIAS=$alias"
              echo "DEXNOTAS_KEY_PASSWORD=$key_pass"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release key in the repository's secrets: signing with a debug key (pre-release)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK (arm64-v8a)
        working-directory: apps/dexnotas/android
        run: |
          ./gradlew --no-daemon assembleRelease -Pdexnotas.abis=arm64-v8a \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/out/DexNotas-${{ steps.version.outputs.version }}-arm64-v8a.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum *.apk > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DexNotas ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.key.outputs.signed != 'true' || steps.version.outputs.pre == 'true' }}
          body_path: ${{ steps.version.outputs.notes }}
          files: |
            ${{ runner.temp }}/out/*.apk
            ${{ runner.temp }}/out/SHA256SUMS.txt
